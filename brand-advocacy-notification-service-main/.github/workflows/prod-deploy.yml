name: Deploy Notification Service Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notification-service-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate workflow actor
        run: |
          if [ "${GITHUB_ACTOR}" != "manuchandran-moonhive" ]; then
            echo "Only manuchandran-moonhive may run SocialRipple workflows."
            exit 1
          fi

      - name: Validate workflow ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Notification production deploys must run from refs/heads/main."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.PROD_NGINX_VM }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh root@${{ secrets.PROD_NGINX_VM }} 'mkdir -p /github/prod/notification-service'

      - name: Copy files to app VM
        run: |
          rsync -avz --delete ./ root@${{ secrets.PROD_NGINX_VM }}:/github/prod/notification-service/

      - name: Execute production deployment script
        run: |
          ssh root@${{ secrets.PROD_NGINX_VM }} \
            "SOCIALRIPPLE_CI_DEPLOY='1' \
             DB_HOST='${{ secrets.PROD_DB_HOST }}' \
             DB_PORT='${{ secrets.PROD_DB_PORT }}' \
             DB_NAME='${{ secrets.PROD_DB_NAME }}' \
             DB_USER='${{ secrets.PROD_DB_USER }}' \
             DB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}' \
             APP_CORS_ALLOWED_ORIGINS='${{ secrets.APP_CORS_ALLOWED_ORIGINS }}' \
             bash /github/prod/notification-service/deploy/prod/prod-deploy.sh"
