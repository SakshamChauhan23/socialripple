spring.application.name=usermanagement

spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
 
spring.main.allow-circular-references=true
 
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl.auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.ai.gemini.api-key=${APP_AI_GEMINI_API_KEY:}
app.ai.gemini.api-url=${APP_AI_GEMINI_API_URL:}
app.ai.gemini.flash-api-url=${APP_AI_GEMINI_FLASH_API_URL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.public.frontend-base-url=${APP_FRONTEND_BASE_URL:https://dashboard.socialripple.ai}
app.public.api-base-url=${APP_API_BASE_URL:https://api.socialripple.ai}
app.oauth.linkedin-client-id=${APP_OAUTH_LINKEDIN_CLIENT_ID:}
app.oauth.linkedin-org-client-id=${APP_OAUTH_LINKEDIN_ORG_CLIENT_ID:${app.oauth.linkedin-client-id}}
app.oauth.linkedin-callback-url=${APP_OAUTH_LINKEDIN_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/linkedin/callback}
app.oauth.facebook-callback-url=${APP_OAUTH_FACEBOOK_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/fb/callback}
app.oauth.instagram-callback-url=${APP_OAUTH_INSTAGRAM_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/instagram/callback}
app.oauth.meta-app-id=${APP_OAUTH_META_APP_ID:1910917019454230}
app.security.recaptcha.secret-key=${APP_SECURITY_RECAPTCHA_SECRET_KEY:}
app.security.recaptcha.verify-url=${APP_SECURITY_RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
app.security.recaptcha.min-score=${APP_SECURITY_RECAPTCHA_MIN_SCORE:0.1}
app.proxy.external-ingestion-url=${APP_PROXY_EXTERNAL_INGESTION_URL:http://localhost:8080}
app.proxy.products-url=${APP_PROXY_PRODUCTS_URL:http://localhost:8082}
app.proxy.orders-url=${APP_PROXY_ORDERS_URL:http://localhost:8083}

