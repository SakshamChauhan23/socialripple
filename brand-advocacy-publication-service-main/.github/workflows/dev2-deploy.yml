name: Deploy Publication Service Dev2

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: publication-service-dev2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate public URL configuration
        run: |
          test -n "${{ secrets.DEV_FRONTEND_DOMAIN }}"
          test -n "${{ secrets.DEV_API_DOMAIN }}"
          test -n "${{ secrets.APP_OAUTH_LINKEDIN_CLIENT_ID }}"
          test -n "${{ secrets.APP_OAUTH_LINKEDIN_CLIENT_SECRET }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.DEV_NGINX_VM }}" >> ~/.ssh/known_hosts

      - name: Copy source to dev2
        run: |
          ssh root@${{ secrets.DEV_NGINX_VM }} 'mkdir -p /github/dev2/publication-service'
          rsync -avz --delete ./ root@${{ secrets.DEV_NGINX_VM }}:/github/dev2/publication-service/

      - name: Execute deployment script on dev2
        run: |
          ssh root@${{ secrets.DEV_NGINX_VM }} \
            "DB_HOST='${{ secrets.DEV_DB_HOST }}' \
             DB_PORT='${{ secrets.DEV_DB_PORT }}' \
             DB_NAME='${{ secrets.DEV_DB_NAME }}' \
             DB_USER='${{ secrets.DEV_DB_USER }}' \
             DB_PASSWORD='${{ secrets.DEV_DB_PASSWORD }}' \
             APP_FRONTEND_BASE_URL='https://${{ secrets.DEV_FRONTEND_DOMAIN }}' \
             APP_API_BASE_URL='https://${{ secrets.DEV_API_DOMAIN }}' \
             APP_OAUTH_META_APP_ID='${{ secrets.APP_OAUTH_META_APP_ID }}' \
             APP_OAUTH_META_APP_SECRET='${{ secrets.APP_OAUTH_META_APP_SECRET }}' \
             APP_OAUTH_FACEBOOK_CALLBACK_URL='https://${{ secrets.DEV_API_DOMAIN }}/external-ingestion/v1/api/fb/callback' \
             APP_OAUTH_INSTAGRAM_CALLBACK_URL='https://${{ secrets.DEV_API_DOMAIN }}/external-ingestion/v1/api/instagram/callback' \
             APP_OAUTH_LINKEDIN_CLIENT_ID='${{ secrets.APP_OAUTH_LINKEDIN_CLIENT_ID }}' \
             APP_OAUTH_LINKEDIN_CLIENT_SECRET='${{ secrets.APP_OAUTH_LINKEDIN_CLIENT_SECRET }}' \
             APP_OAUTH_LINKEDIN_CALLBACK_URL='https://${{ secrets.DEV_API_DOMAIN }}/external-ingestion/v1/api/linkedin/callback' \
             APP_OAUTH_LINKEDIN_SCOPE='${{ secrets.APP_OAUTH_LINKEDIN_SCOPE }}' \
             APP_OAUTH_ORG_LINKEDIN_CALLBACK_URL='https://${{ secrets.DEV_API_DOMAIN }}/external-ingestion/v1/api/org/business-pages/linkedin/callback' \
             APP_OAUTH_ORG_X_CALLBACK_URL='https://${{ secrets.DEV_API_DOMAIN }}/external-ingestion/v1/api/org/business-pages/x/callback' \
             APP_OAUTH_X_CONSUMER_KEY='${{ secrets.APP_OAUTH_X_CONSUMER_KEY }}' \
             APP_OAUTH_X_CONSUMER_SECRET='${{ secrets.APP_OAUTH_X_CONSUMER_SECRET }}' \
             APP_OAUTH_LINKEDIN_ORG_CLIENT_ID='${{ secrets.APP_OAUTH_LINKEDIN_ORG_CLIENT_ID }}' \
             APP_OAUTH_LINKEDIN_ORG_CLIENT_SECRET='${{ secrets.APP_OAUTH_LINKEDIN_ORG_CLIENT_SECRET }}' \
             APP_CORS_ALLOWED_ORIGINS='https://${{ secrets.DEV_FRONTEND_DOMAIN }},https://advocacy-dev.moonhive-server.in.net,http://localhost:3000' \
             bash /github/dev2/publication-service/deploy/dev2/deploy.sh"

      - name: Restore HTTPS if nginx config was corrupted
        run: |
          ssh root@${{ secrets.DEV_NGINX_VM }} \
            "if ! grep -q 'listen 443' /etc/nginx/sites-available/${{ secrets.DEV_API_DOMAIN }}.conf 2>/dev/null; then
               echo 'HTTPS missing from nginx config — restoring via certbot'
               certbot --nginx --non-interactive --agree-tos --redirect \
                 -m devops@moonhive.in \
                 -d ${{ secrets.DEV_API_DOMAIN }}
               nginx -t && systemctl reload nginx
             else
               echo 'HTTPS config intact — no action needed'
             fi"
