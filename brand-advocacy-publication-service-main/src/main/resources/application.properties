spring.application.name=external ingestion

spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.main.allow-circular-references=true
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl.auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

twitter.consumer.key=${APP_OAUTH_X_CONSUMER_KEY:}
twitter.consumer.secret=${APP_OAUTH_X_CONSUMER_SECRET:}
twitter.callback.url=${APP_OAUTH_X_CALLBACK_URL:http://localhost:8080/api/x/callback}

# Increase file upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

twitter.local.filepath=
task.interval=11

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}


app.public.frontend-base-url=${APP_FRONTEND_BASE_URL:https://dashboard.socialripple.ai}
app.public.api-base-url=${APP_API_BASE_URL:https://api.socialripple.ai}
app.public.notification-callback-url=${APP_NOTIFICATION_CALLBACK_URL:${app.public.api-base-url}/v1/websocket/message}
app.oauth.x-callback-url=${APP_OAUTH_X_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/x/callback}
app.oauth.linkedin-callback-url=${APP_OAUTH_LINKEDIN_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/linkedin/callback}
app.oauth.facebook-callback-url=${APP_OAUTH_FACEBOOK_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/fb/callback}
app.oauth.instagram-callback-url=${APP_OAUTH_INSTAGRAM_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/instagram/callback}
app.oauth.org-facebook-callback-url=${APP_OAUTH_ORG_FACEBOOK_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/org/business-pages/facebook/callback}
app.oauth.org-instagram-callback-url=${APP_OAUTH_ORG_INSTAGRAM_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/org/business-pages/instagram/callback}
app.oauth.org-linkedin-callback-url=${APP_OAUTH_ORG_LINKEDIN_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/org/business-pages/linkedin/callback}
app.oauth.org-x-callback-url=${APP_OAUTH_ORG_X_CALLBACK_URL:${app.public.api-base-url}/external-ingestion/v1/api/org/business-pages/x/callback}
app.oauth.meta-app-id=${APP_OAUTH_META_APP_ID:1910917019454230}
app.oauth.meta-app-secret=${APP_OAUTH_META_APP_SECRET:}
app.oauth.linkedin-client-id=${APP_OAUTH_LINKEDIN_CLIENT_ID:}
app.oauth.linkedin-client-secret=${APP_OAUTH_LINKEDIN_CLIENT_SECRET:}
app.oauth.linkedin-scope=${APP_OAUTH_LINKEDIN_SCOPE:openid profile w_member_social rw_organization_admin r_organization_social}
app.oauth.linkedin-org-client-id=${APP_OAUTH_LINKEDIN_ORG_CLIENT_ID:${app.oauth.linkedin-client-id}}
app.oauth.linkedin-org-client-secret=${APP_OAUTH_LINKEDIN_ORG_CLIENT_SECRET:${app.oauth.linkedin-client-secret}}
app.oauth.linkedin-org-scope=${APP_OAUTH_LINKEDIN_ORG_SCOPE:r_organization_social rw_organization_admin w_organization_social}
