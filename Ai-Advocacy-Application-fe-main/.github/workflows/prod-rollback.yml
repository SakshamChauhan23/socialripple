name: Rollback Frontend Production

on:
  workflow_dispatch:

concurrency:
  group: frontend-production-rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.PROD_NGINX_VM }}" >> ~/.ssh/known_hosts

      - name: Copy files to app VM
        run: |
          rsync -avz ./deploy/prod/ root@${{ secrets.PROD_NGINX_VM }}:/github/prod/advocacy-fe/deploy/prod/

      - name: Execute rollback
        run: |
          ssh root@${{ secrets.PROD_NGINX_VM }} \
            "SOCIALRIPPLE_CI_DEPLOY='1' \
             PROD_FRONTEND_DOMAIN='${{ secrets.PROD_FRONTEND_DOMAIN }}' \
             PROD_FE_WEBROOT='${{ secrets.PROD_FE_WEBROOT }}' \
             bash /github/prod/advocacy-fe/deploy/prod/rollback.sh"
